<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Thermometer tube body -->
  <rect x="43" y="8" width="14" height="56" rx="7" stroke="#27272a" stroke-width="2.5" fill="none"/>
  <!-- Mercury fill inside tube (bottom portion) -->
  <rect x="46" y="42" width="8" height="22" rx="2" fill="#52525b"/>
  <!-- Tick mark line at top of fill -->
  <line x1="42" y1="42" x2="38" y2="42" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
  <!-- Bulb -->
  <circle cx="50" cy="76" r="14" stroke="#27272a" stroke-width="2.5" fill="none"/>
  <circle cx="50" cy="76" r="9" fill="#52525b"/>
  <!-- Scale marks right side -->
  <line x1="60" y1="18" x2="68" y2="18" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="28" x2="64" y2="28" stroke="#3f3f46" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="38" x2="68" y2="38" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="48" x2="64" y2="48" stroke="#3f3f46" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="58" x2="68" y2="58" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
</svg>
